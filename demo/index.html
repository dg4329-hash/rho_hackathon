<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mesh — product film</title>
<style>
  :root { --bg:#000; --ink:#f5f5f7; --accent:#0071e3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; }
  #viewport { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #f5f5f7;
    transform-origin: center center; border-radius: 0; }
  .scene { position: absolute; inset: 0; width: 1280px; height: 720px; overflow: hidden;
    opacity: 0; transition: opacity .7s cubic-bezier(.2,.8,.2,1), filter .7s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1);
    filter: blur(8px); transform: scale(1.02); }
  .scene.on { opacity: 1; filter: blur(0); transform: scale(1); }
  .scene.off { opacity: 0; filter: blur(10px); transform: scale(.985); }

  /* cover: the handoff from the live talk */
  #cover { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: #000; color: var(--ink);
    cursor: pointer; transition: opacity .9s cubic-bezier(.2,.8,.2,1); }
  #cover.hide { opacity: 0; pointer-events: none; }
  #cover .mark { width: 88px; height: 88px; border-radius: 22px; background: #f5f5f7; color: #1d1d1f;
    display: grid; place-items: center; font-weight: 700; font-size: 52px; color: #fff; margin: 0 auto 22px;
    box-shadow: 0 20px 60px rgba(255,255,255,.12); }
  #cover h1 { margin: 0; font-size: 56px; letter-spacing: -.03em; font-weight: 700; text-align: center; }
  #cover p { margin: 12px 0 0; color: #86868b; font-size: 20px; text-align: center; }
  #cover .hint { margin-top: 36px; font-size: 13px; color: #6e6e73; letter-spacing: .08em; text-transform: uppercase; }

  /* chrome: progress + chapter, hidden with H for clean recording */
  #chrome { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 10px 18px 14px; color: #a1a1a6; font-size: 12px;
    display: flex; align-items: center; gap: 14px; transition: opacity .3s; }
  body.clean #chrome { opacity: 0; }
  #bar { flex: 1; height: 3px; background: rgba(255,255,255,.14); border-radius: 3px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); }
  #chapter { min-width: 220px; }
  kbd { font: 11px SFMono-Regular, Menlo, monospace; border: 1px solid #3a3a3c; border-radius: 4px; padding: 1px 5px; color: #d2d2d7; }
  #missing { position: absolute; inset: 0; display: grid; place-items: center; color: #6e6e73; font-size: 22px; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="cover">
      <div>
        <div class="mark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" width="54" height="54"><circle cx="3.5" cy="4" r="2"/><circle cx="12.5" cy="4" r="2"/><circle cx="8" cy="12.5" r="2"/><path d="M5.5 4h5M4.6 5.8l2.3 5M11.4 5.8l-2.3 5"/></svg></div>
        <h1>mesh</h1>
        <p>Borrow a teammate's machine, not their credentials.</p>
        <div class="hint">click or press space to play</div>
      </div>
    </div>
  </div>
</div>
<div id="chrome">
  <span id="chapter">ready</span>
  <div id="bar"><div id="fill"></div></div>
  <span><kbd>space</kbd> play/pause &nbsp;<kbd>←</kbd><kbd>→</kbd> scene &nbsp;<kbd>R</kbd> restart &nbsp;<kbd>F</kbd> fullscreen &nbsp;<kbd>H</kbd> hide</span>
</div>

<script>window.MESH_SCENES = [];</script>
<script src="scene1.js"></script>
<script src="scene2.js"></script>
<script src="scene3.js"></script>
<script src="scene4.js"></script>
<script src="scene5.js"></script>
<script src="scene6.js"></script>
<script>
(function () {
  var stage = document.getElementById("stage"), cover = document.getElementById("cover");
  var fill = document.getElementById("fill"), chapter = document.getElementById("chapter");

  function fit() {
    var s = Math.min(innerWidth / 1280, innerHeight / 720);
    stage.style.transform = "scale(" + s + ")";
  }
  addEventListener("resize", fit); fit();

  // Scenes arrive as window.MESH_SCENES entries; a missing file becomes a short placeholder so the film still plays.
  var scenes = [];
  var only = (location.search.match(/[?&]scene=(\d+)/) || [])[1];
  var ids = only ? [Number(only)] : [1, 2, 3, 4, 5, 6];
  ids.forEach(function (id) {
    var found = window.MESH_SCENES.filter(function (x) { return x && x.id === id; })[0];
    scenes.push(found || { id: id, title: "scene " + id, duration: 3000, mount: function (root) { root.innerHTML = '<div id="missing">scene missing</div>'; return function () {}; } });
  });
  var total = scenes.reduce(function (a, s) { return a + s.duration; }, 0);

  var idx = -1, el = null, cleanup = null, sceneStart = 0, paused = false, pausedAt = 0, advanceTimer = null, raf = 0;

  function offsetOf(i) { var t = 0; for (var k = 0; k < i; k++) t += scenes[k].duration; return t; }

  function show(i) {
    clearTimeout(advanceTimer);
    if (el) {
      var old = el, oldCleanup = cleanup;
      old.classList.remove("on"); old.classList.add("off");
      setTimeout(function () { try { oldCleanup && oldCleanup(); } catch (e) {} old.remove(); }, 800);
    }
    idx = i;
    if (i >= scenes.length) { idx = scenes.length - 1; el = null; cleanup = null; return; }
    el = document.createElement("div"); el.className = "scene";
    stage.appendChild(el);
    try { cleanup = scenes[i].mount(el) || null; } catch (e) { console.error("scene " + (i + 1), e); cleanup = null; }
    requestAnimationFrame(function () { requestAnimationFrame(function () { el && el.classList.add("on"); }); });
    chapter.textContent = (i + 1) + " / " + scenes.length + " · " + (scenes[i].title || "");
    sceneStart = performance.now();
    if (i < scenes.length - 1) advanceTimer = setTimeout(function () { show(i + 1); }, scenes[i].duration);
  }

  function tick() {
    if (idx >= 0 && !paused) {
      var t = offsetOf(idx) + Math.min(performance.now() - sceneStart, scenes[idx].duration);
      fill.style.width = (100 * t / total).toFixed(2) + "%";
    }
    raf = requestAnimationFrame(tick);
  }

  function start() { cover.classList.add("hide"); paused = false; show(0); cancelAnimationFrame(raf); tick(); }

  // Pause freezes CSS + WAAPI animations in the stage and the auto-advance; timeouts inside scenes keep their schedule
  // relative to resume because we simply stop the clock (good enough for rehearsal; record without pausing).
  function togglePause() {
    if (idx < 0) return start();
    paused = !paused;
    stage.querySelectorAll("*").forEach(function (n) { n.style.animationPlayState = paused ? "paused" : ""; });
    document.getAnimations().forEach(function (a) { paused ? a.pause() : a.play(); });
    if (paused) { clearTimeout(advanceTimer); pausedAt = performance.now(); }
    else { sceneStart += performance.now() - pausedAt; var left = scenes[idx].duration - (performance.now() - sceneStart);
      if (idx < scenes.length - 1) advanceTimer = setTimeout(function () { show(idx + 1); }, Math.max(0, left)); }
  }

  cover.addEventListener("click", start);
  addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); togglePause(); }
    else if (e.key === "ArrowRight") { if (idx < 0) start(); else if (idx < scenes.length - 1) { paused = false; show(idx + 1); } }
    else if (e.key === "ArrowLeft") { if (idx > 0) { paused = false; show(idx - 1); } }
    else if (e.key === "r" || e.key === "R") { paused = false; show(0); cover.classList.add("hide"); cancelAnimationFrame(raf); tick(); }
    else if (e.key === "f" || e.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    else if (e.key === "h" || e.key === "H") { document.body.classList.toggle("clean"); }
  });
  // ?autoplay=1 for recording
  if (/[?&]autoplay=1/.test(location.search)) { document.body.classList.add("clean"); start(); }
})();
</script>
</body>
</html>
